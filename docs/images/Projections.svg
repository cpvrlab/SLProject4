<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1850 660" width="1850" height="660" font-family="DejaVu Sans, Verdana, Geneva, sans-serif">
  <title>Taxonomy of planar geometric projections</title>

  <style>
    .box  { stroke:#000; stroke-width:3; }
    .root { stroke-width:5; fill:#fff; }
    .cyan   { fill:#c9f0f5; }
    .orange { fill:#f4b781; }
    .pink   { fill:#f290c9; }
    .yellow { fill:#f7f792; }
    .lbl  { font-size:34px; fill:#000; text-anchor:middle; }
    .link { stroke:#000; stroke-width:2.5; fill:none; }
  </style>

  <rect x="0" y="0" width="1850" height="660" fill="#fff"/>

  <!-- connections: parent bottom centre -> child top centre -->
  <g class="link">
    <path d="M 860,80 L 362,140"/>
    <path d="M 860,80 L 1340,140"/>

    <path d="M 362,250 L 115,320"/>
    <path d="M 362,250 L 366,320"/>
    <path d="M 362,250 L 614,320"/>

    <path d="M 1340,250 L 1057,320"/>
    <path d="M 1340,250 L 1590,320"/>

    <path d="M 1057,380 L 862,450"/>
    <path d="M 1057,380 L 1240,450"/>

    <path d="M 1590,380 L 1513,450"/>
    <path d="M 1590,380 L 1733,450"/>

    <path d="M 862,510 L 555,580"/>
    <path d="M 862,510 L 800,580"/>
    <path d="M 862,510 L 1020,580"/>

    <path d="M 1240,510 L 1240,580"/>
    <path d="M 1240,510 L 1470,580"/>
    <path d="M 1240,510 L 1700,580"/>
  </g>

  <!-- level 0 -->
  <rect class="box root" x="710" y="20" width="300" height="60"/>
  <text class="lbl" x="860" y="62">Projections</text>

  <!-- level 1 -->
  <rect class="box cyan"   x="177"  y="140" width="370" height="110"/>
  <text class="lbl" x="362" y="187">central</text>
  <text class="lbl" x="362" y="229">(perspective)</text>

  <rect class="box orange" x="1157" y="140" width="365" height="110"/>
  <text class="lbl" x="1340" y="208">parallel</text>

  <!-- level 2 -->
  <rect class="box cyan" x="8"   y="320" width="215" height="60"/>
  <text class="lbl" x="115" y="362">1-point</text>

  <rect class="box cyan" x="258" y="320" width="215" height="60"/>
  <text class="lbl" x="366" y="362">2-point</text>

  <rect class="box cyan" x="506" y="320" width="215" height="60"/>
  <text class="lbl" x="614" y="362">3-point</text>

  <rect class="box pink"   x="872"  y="320" width="370" height="60"/>
  <text class="lbl" x="1057" y="362">orthographic</text>

  <rect class="box yellow" x="1405" y="320" width="370" height="60"/>
  <text class="lbl" x="1590" y="362">oblique</text>

  <!-- level 3 -->
  <rect class="box pink" x="715"  y="450" width="295" height="60"/>
  <text class="lbl" x="862" y="492">multiview</text>

  <rect class="box pink" x="1092" y="450" width="295" height="60"/>
  <text class="lbl" x="1240" y="492">axonometric</text>

  <rect class="box yellow" x="1415" y="450" width="195" height="60"/>
  <text class="lbl" x="1513" y="492">cavalier</text>

  <rect class="box yellow" x="1635" y="450" width="195" height="60"/>
  <text class="lbl" x="1733" y="492">cabinet</text>

  <!-- level 4 -->
  <rect class="box pink" x="435" y="580" width="240" height="60"/>
  <text class="lbl" x="555" y="622">top view</text>

  <rect class="box pink" x="685" y="580" width="230" height="60"/>
  <text class="lbl" x="800" y="622">front view</text>

  <rect class="box pink" x="927" y="580" width="185" height="60"/>
  <text class="lbl" x="1020" y="622">section</text>

  <rect class="box pink" x="1132" y="580" width="215" height="60"/>
  <text class="lbl" x="1240" y="622">trimetric</text>

  <rect class="box pink" x="1362" y="580" width="215" height="60"/>
  <text class="lbl" x="1470" y="622">dimetric</text>

  <rect class="box pink" x="1585" y="580" width="230" height="60"/>
  <text class="lbl" x="1700" y="622">isometric</text>
</svg>
